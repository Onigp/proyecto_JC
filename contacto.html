<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | CyberGuard Pyme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public/assents/css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><path class="brand-shield" d="M24 4 39 10v12c0 10-6 17-15 22C15 39 9 32 9 22V10z"/><path class="brand-lock" d="M18 22v-3a6 6 0 0 1 12 0v3m-14 0h16v12H16z"/><circle class="brand-keyhole" cx="24" cy="27" r="1.7"/><path class="brand-keyhole" d="M24 29v2"/><path class="brand-spark" d="M36 8v5m-2.5-2.5h5"/></svg></span><span>CyberGuard <em>Pyme</em></span></a>
    <nav aria-label="Navegación principal"><a href="index.html#catalogo">Catálogo</a><a href="servicios.html">Servicios</a><a href="contacto.html">Contacto</a><a href="admin.html">Administración</a></nav>
  </header>
  <main>
    <section class="contact-section">
      <p class="eyebrow">Contacto</p><h2>Contanos cuál es tu necesidad.</h2>
      <form id="contactoForm" class="contact-form">
        <label for="contactoNombre">Nombre</label><input id="contactoNombre" name="nombre" required>
        <label for="contactoEmail">Correo</label><input id="contactoEmail" name="email" type="email" required>
        <label for="contactoMensaje">Mensaje</label><textarea id="contactoMensaje" name="mensaje" rows="5" required></textarea>
        <button id="contactoEnviar" type="submit">Enviar consulta</button>
      </form>
      <p id="contactoEstado" class="hidden" role="status"></p>
      <a class="contact-link" href="mailto:hola@cyberguardpyme.com">hola@cyberguardpyme.com <span aria-hidden="true">↗</span></a>
    </section>
  </main>
  <footer><p>&copy; 2026 CyberGuard Pyme. Seguridad clara para negocios reales.</p></footer>
  <script>
    document.getElementById("contactoForm").addEventListener("submit", function(event) {
      event.preventDefault();
      var nombre = document.getElementById("contactoNombre").value.trim();
      var email = document.getElementById("contactoEmail").value.trim();
      var mensaje = document.getElementById("contactoMensaje").value.trim();
      if (!nombre || !email || !mensaje) return;
      var consultas = JSON.parse(localStorage.getItem("cyberguard_consultas") || "[]");
      consultas.push({ nombre: nombre, email: email, mensaje: mensaje, fecha: new Date().toISOString() });
      localStorage.setItem("cyberguard_consultas", JSON.stringify(consultas));
      var estado = document.getElementById("contactoEstado");
      estado.textContent = "Gracias, " + nombre + ". Tu consulta quedó registrada.";
      estado.classList.remove("hidden");
      this.reset();
    });
  </script>
</body>
</html>
